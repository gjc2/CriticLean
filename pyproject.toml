[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-critic-lab"
version = "0.2.1"
description = "CriticLeanBench published-prompt evaluation with DeepSeek replacing CriticLeanGPT"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/Apache-2.0.txt"]
authors = [{name = "ReductionLab contributors"}]
keywords = ["Lean", "autoformalization", "evaluation", "LLM", "semantic-correspondence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
datasets = ["pyarrow>=17,<30"]
dev = ["build>=1.2,<2"]

[project.scripts]
lean-critic = "lean_critic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

